limit_req_zone $binary_remote_addr zone=larocota_api:10m rate=10r/s;

server {
    listen 80;
    server_name larocota.com www.larocota.com;
    return 301 https://larocota.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.larocota.com;

    ssl_certificate /etc/letsencrypt/live/larocota.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/larocota.com/privkey.pem;

    return 301 https://larocota.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name larocota.com;

    ssl_certificate /etc/letsencrypt/live/larocota.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/larocota.com/privkey.pem;
    client_max_body_size 8m;

    location /api/v1/ {
        limit_req zone=larocota_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
